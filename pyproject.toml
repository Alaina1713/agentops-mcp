[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-mcp"
version = "0.1.0"
description = "An MCP server for observing, tracing, and analysing AI agent executions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alaina Rahim" }]
dependencies = ["mcp[cli]>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
agentops-mcp = "agentops_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
